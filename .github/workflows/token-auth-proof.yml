name: Token authentication proof

on: pull_request

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject personal token reads
        run: |
          if grep -nE 'secrets\.(ORG_GITHUB_TOKEN|GHCR_PAT|UPSTREAM_SYNC_PAT|RELEASE_TOKEN|QITP_ANTON_DISPATCH_TOKEN)' .github/workflows/*.yml; then
            echo 'Personal token secret read remains'
            exit 1
          fi
      - name: Mint repository scoped CI App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Verify repository API and git access without creating a tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '{full_name, permissions}'
          gh auth setup-git
          git -c http.https://github.com/.extraheader= ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/dev
