name: release-chart

on:
  push:
    tags:
      - 'v*'
  # Fallback publish path. A tag pushed with GITHUB_TOKEN does not trigger the
  # push event above, so a release cut without ORG_GITHUB_TOKEN has to publish
  # from here.
  workflow_dispatch:
    inputs:
      version:
        description: "Chart version to publish (default: the ref's Chart.yaml)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Package & Push Helm Chart to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "$GITHUB_REF_TYPE" in
              tag) VERSION="${GITHUB_REF_NAME#v}" ;;
              *)   VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}') ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: helm package . --version "${{ steps.version.outputs.version }}"

      - name: Push to GHCR
        run: helm push tcc-k8s-service-template-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/the-cloud-clockwork
