name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          CURRENT=$(grep '^version:' Chart.yaml | awk '{print $2}')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create release branch and bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b release/v${{ steps.version.outputs.next }}
          sed -i 's/^version: .*/version: ${{ steps.version.outputs.next }}/' Chart.yaml
          git add Chart.yaml
          git commit -m "chore: release v${{ steps.version.outputs.next }}"
          git push origin release/v${{ steps.version.outputs.next }}

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head release/v${{ steps.version.outputs.next }} \
            --title "chore: release v${{ steps.version.outputs.next }}" \
            --body "Bumps chart version from \`${{ steps.version.outputs.current }}\` to \`${{ steps.version.outputs.next }}\` (${{ inputs.bump }}).

          Merging this PR will automatically tag and publish the chart to GHCR."
