name: Auto-tag release

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Recovery path. The auto-tag fires only on a release/* PR merging into main,
  # so a release whose tag step failed (ORG_GITHUB_TOKEN unset, 2026-08-21)
  # leaves a published chart with no tag and no way to reach this workflow.
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to tag (branch, tag or SHA)"
        required: true
        default: "main"
        type: string

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.ORG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Read version and create tag
        run: |
          VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}')
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created and pushed tag $TAG"

      - name: Clean up release branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          git push origin --delete "$BRANCH" || true
