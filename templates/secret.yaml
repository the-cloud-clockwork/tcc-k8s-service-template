{{- $own := printf "%s-secrets" (include "k8s-service-template.fullname" .) }}
{{- $eso := "" }}
{{- if .Values.externalSecret.enabled }}
{{- $eso = .Values.externalSecret.targetSecretName | default $own }}
{{- end }}
{{- if and .Values.secrets.enabled (not .Values.secrets.external.enabled) (ne $eso $own) }}
{{- if .Values.secrets.vault.enabled }}
# Vault SecretProviderClass for CSI Secret Store Driver
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "k8s-service-template.fullname" . }}-vault-secrets
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "k8s-service-template.labels" . | nindent 4 }}
  {{- with (include "k8s-service-template.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.example.com:8200"
    roleName: "{{ .Values.global.project }}-role"
    objects: |
      {{- range .Values.secrets.vault.secrets }}
      - objectName: "{{ .name }}"
        secretPath: "{{ $.Values.secrets.vault.path }}/{{ $.Release.Name }}"
        secretKey: "{{ .key }}"
      {{- end }}
  secretObjects:
    - data:
        {{- range .Values.secrets.vault.secrets }}
        - objectName: "{{ .name }}"
          key: "{{ .name }}"
        {{- end }}
      secretName: {{ include "k8s-service-template.fullname" . }}-secrets
      type: Opaque

---
{{- else }}
# Manual Kubernetes Secret (fallback when Vault is not enabled)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-service-template.fullname" . }}-secrets
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "k8s-service-template.labels" . | nindent 4 }}
  {{- with (include "k8s-service-template.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}
{{- end }}

