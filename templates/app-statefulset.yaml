{{- if and (eq .Values.app.type "statefulset") (not .Values.database.enabled) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "k8s-service-template.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "k8s-service-template.labels" . | nindent 4 }}
  {{- with (include "k8s-service-template.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "k8s-service-template.fullname" . }}-headless
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "k8s-service-template.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-service-template.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if hasKey .Values "enableServiceLinks" }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- else }}
      enableServiceLinks: true
      {{- end }}
      {{- include "k8s-service-template.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "k8s-service-template.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds | default 30 }}
      {{- include "k8s-service-template.securityContext" . | nindent 6 }}
      {{- if or .Values.initContainers (and .Values.configFiles.enabled .Values.configFiles.initContainer.enabled) }}
      initContainers:
        {{- include "k8s-service-template.configInitContainer" . | nindent 8 }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- with .Values.app.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.app.container.command }}
          command:
            {{- range .Values.app.container.command }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.app.container.args }}
          args:
            {{- range .Values.app.container.args }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.app.container.port }}
              protocol: TCP
          env:
            {{- include "k8s-service-template.env" . | nindent 12 }}
          {{- if .Values.secrets.enabled }}
          envFrom:
            {{- if .Values.secrets.external.enabled }}
            {{- if .Values.secrets.external.secretName }}
            - secretRef:
                name: {{ .Values.secrets.external.secretName }}
            {{- end }}
            {{- with .Values.secrets.external.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- else }}
            - secretRef:
                name: {{ include "k8s-service-template.fullname" . }}-secrets
            {{- end }}
          {{- end }}
          {{- if .Values.configMap.enabled }}
            - configMapRef:
                name: {{ include "k8s-service-template.fullname" . }}-config
          {{- end }}
          {{- if .Values.app.healthChecks.enabled }}
          {{- with .Values.app.healthChecks.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.app.healthChecks.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.app.healthChecks.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          {{- if or .Values.persistence.enabled .Values.configFiles.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            {{- include "k8s-service-template.volumeMounts" . | nindent 12 }}
            {{- end }}
            {{- if .Values.configFiles.enabled }}
            {{- include "k8s-service-template.configFileMounts" . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.persistence.enabled .Values.configFiles.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.configFiles.enabled }}
        {{- include "k8s-service-template.configFileVolumes" . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    {{- range .Values.persistence.volumes }}
    - metadata:
        name: {{ .name }}
        labels:
          {{- include "k8s-service-template.labels" $ | nindent 10 }}
      spec:
        accessModes:
          - {{ .accessMode }}
        storageClassName: {{ .storageClass }}
        resources:
          requests:
            storage: {{ .size }}
    {{- end }}
  {{- end }}
{{- end }}

---
{{- if and (eq .Values.app.type "statefulset") (not .Values.database.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-service-template.fullname" . }}-headless
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "k8s-service-template.labels" . | nindent 4 }}
    app.kubernetes.io/component: headless
  {{- with (include "k8s-service-template.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "k8s-service-template.selectorLabels" . | nindent 4 }}
{{- end }}