{{- if eq .Values.app.type "deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-service-template.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "k8s-service-template.labels" . | nindent 4 }}
  {{- with (include "k8s-service-template.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  {{- if .Values.app.strategy }}
  strategy:
    {{- if eq .Values.app.strategy.type "Recreate" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    {{- if .Values.app.strategy.rollingUpdate }}
    rollingUpdate:
      {{- with .Values.app.strategy.rollingUpdate.maxSurge }}
      maxSurge: {{ . }}
      {{- end }}
      {{- with .Values.app.strategy.rollingUpdate.maxUnavailable }}
      maxUnavailable: {{ . }}
      {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "k8s-service-template.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-service-template.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.app.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if hasKey .Values "enableServiceLinks" }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- else }}
      enableServiceLinks: true
      {{- end }}
      {{- include "k8s-service-template.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "k8s-service-template.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds | default 30 }}
      {{- include "k8s-service-template.securityContext" . | nindent 6 }}
      {{- if or .Values.initContainers (and .Values.configFiles.enabled .Values.configFiles.initContainer.enabled) }}
      initContainers:
        {{- include "k8s-service-template.configInitContainer" . | nindent 8 }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- with .Values.app.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.app.container.command }}
          command:
            {{- range .Values.app.container.command }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.app.container.args }}
          args:
            {{- range .Values.app.container.args }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.app.container.port }}
              protocol: TCP
          env:
            {{- include "k8s-service-template.env" . | nindent 12 }}
          {{- if .Values.secrets.enabled }}
          envFrom:
            {{- if .Values.secrets.external.enabled }}
            {{- if .Values.secrets.external.secretName }}
            - secretRef:
                name: {{ .Values.secrets.external.secretName }}
            {{- end }}
            {{- with .Values.secrets.external.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- else }}
            - secretRef:
                name: {{ include "k8s-service-template.fullname" . }}-secrets
            {{- end }}
          {{- end }}
          {{- if .Values.configMap.enabled }}
            - configMapRef:
                name: {{ include "k8s-service-template.fullname" . }}-config
          {{- end }}
          {{- if .Values.app.healthChecks.enabled }}
          {{- with .Values.app.healthChecks.startupProbe }}
          startupProbe:
            {{- include "k8s-service-template.sanitizeProbe" . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- include "k8s-service-template.sanitizeProbe" .Values.app.healthChecks.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- include "k8s-service-template.sanitizeProbe" .Values.app.healthChecks.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          {{- if or .Values.persistence.enabled .Values.configFiles.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            {{- include "k8s-service-template.volumeMounts" . | nindent 12 }}
            {{- end }}
            {{- if .Values.configFiles.enabled }}
            {{- include "k8s-service-template.configFileMounts" . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.persistence.enabled .Values.configFiles.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.persistence.enabled }}
        {{- include "k8s-service-template.volumeClaims" . | nindent 8 }}
        {{- end }}
        {{- if .Values.configFiles.enabled }}
        {{- include "k8s-service-template.configFileVolumes" . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
{{- end }}

{{- if .Values.deployments }}
{{- range $deploymentName, $deployment := .Values.deployments }}
{{- if $deployment.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-service-template.fullname" $ }}-{{ $deploymentName }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "k8s-service-template.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $deploymentName }}
    app.kubernetes.io/role: {{ $deployment.role | default $deploymentName }}
  {{- with (include "k8s-service-template.annotations" $) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $deployment.replicaCount | default 1 }}
  {{- end }}
  {{- if or $.Values.app.strategy $deployment.strategy }}
  {{- $strategy := $deployment.strategy | default $.Values.app.strategy }}
  strategy:
    {{- if eq $strategy.type "Recreate" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    {{- if $strategy.rollingUpdate }}
    rollingUpdate:
      {{- with $strategy.rollingUpdate.maxSurge }}
      maxSurge: {{ . }}
      {{- end }}
      {{- with $strategy.rollingUpdate.maxUnavailable }}
      maxUnavailable: {{ . }}
      {{- end }}
    {{- end }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "k8s-service-template.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $deploymentName }}
  template:
    metadata:
      labels:
        {{- include "k8s-service-template.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $deploymentName }}
        app.kubernetes.io/role: {{ $deployment.role | default $deploymentName }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $deployment.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $deployment.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "k8s-service-template.imagePullSecrets" $ | nindent 6 }}
      serviceAccountName: {{ include "k8s-service-template.serviceAccountName" $ }}
      {{- include "k8s-service-template.securityContext" $ | nindent 6 }}
      containers:
        - name: {{ $.Values.app.name }}-{{ $deploymentName }}
          image: "{{ $.Values.app.image.repository }}:{{ $.Values.app.image.tag }}"
          imagePullPolicy: {{ $.Values.app.image.pullPolicy }}
          {{- if $deployment.command }}
          command:
            {{- range $deployment.command }}
            - {{ . | quote }}
            {{- end }}
          {{- else if $.Values.app.container.command }}
          command:
            {{- range $.Values.app.container.command }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $deployment.args }}
          args:
            {{- range $deployment.args }}
            - {{ . | quote }}
            {{- end }}
          {{- else if $.Values.app.container.args }}
          args:
            {{- range $.Values.app.container.args }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $.Values.app.container.port }}
              protocol: TCP
          env:
            {{- include "k8s-service-template.env" $ | nindent 12 }}
            {{- range $key, $value := $deployment.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if $.Values.secrets.enabled }}
          envFrom:
            {{- if $.Values.secrets.external.enabled }}
            {{- if $.Values.secrets.external.secretName }}
            - secretRef:
                name: {{ $.Values.secrets.external.secretName }}
            {{- end }}
            {{- with $.Values.secrets.external.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- else }}
            - secretRef:
                name: {{ include "k8s-service-template.fullname" $ }}-secrets
            {{- end }}
          {{- end }}
          {{- if $.Values.configMap.enabled }}
            - configMapRef:
                name: {{ include "k8s-service-template.fullname" $ }}-config
          {{- end }}
          {{- if or $.Values.app.healthChecks.enabled $deployment.healthChecks.enabled }}
          {{- $healthChecks := $deployment.healthChecks | default $.Values.app.healthChecks }}
          {{- if $healthChecks.enabled }}
          livenessProbe:
            {{- toYaml $healthChecks.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $healthChecks.readinessProbe | nindent 12 }}
          {{- end }}
          {{- end }}
          resources:
            {{- if $deployment.resources }}
            {{- toYaml $deployment.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.app.resources | nindent 12 }}
            {{- end }}
      {{- with ($deployment.nodeSelector | default $.Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($deployment.affinity | default $.Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($deployment.tolerations | default $.Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.priorityClassName }}
      priorityClassName: {{ $.Values.priorityClassName }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}