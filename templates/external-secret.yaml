{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "k8s-service-template.fullname" . }}-secrets
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "k8s-service-template.labels" . | nindent 4 }}
  {{- with (include "k8s-service-template.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "30s" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName | default "openbao" }}
    kind: {{ .Values.externalSecret.storeKind | default "ClusterSecretStore" }}
  target:
    name: {{ .Values.externalSecret.targetSecretName | default (printf "%s-secrets" (include "k8s-service-template.fullname" .)) }}
    creationPolicy: {{ .Values.externalSecret.creationPolicy | default "Owner" }}
    deletionPolicy: {{ .Values.externalSecret.deletionPolicy | default "Retain" }}
  dataFrom:
    - extract:
        key: {{ required "externalSecret.secretPath is required when externalSecret.enabled=true" (.Values.externalSecret.secretPath | default .Values.externalSecret.awsSecretPath) }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  {{- with .Values.externalSecret.extraData }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
