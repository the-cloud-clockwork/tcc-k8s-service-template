{{- if .Values.externalService.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.externalService.name }}
  namespace: {{ .Values.externalService.targetNamespace | default .Release.Namespace | quote }}
  labels:
    {{- include "k8s-service-template.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.externalService.externalName }}
  ports:
  - port: {{ .Values.externalService.port }}
    targetPort: {{ .Values.externalService.port }}
{{- end }}